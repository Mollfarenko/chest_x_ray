# environment.yml
name: chest_x_ray
channels:
  - defaults
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyterlab
  - torchvision
  - pytorch
  - cudatoolkit=11.8  # Optional: Only if using GPU (check compatibility)
  - pip:
      - tqdm
      - opencv-python
      - pillow
      - tensorboard  # for visualizing training
